name : Run Ansible Playbook
on: 
  push:
    branches: [main]

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v3
          
        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.9'

        - name: Install Ansible
          run: pip install ansible
          
        - name: Run Ansible Playbook
          run: ansible-playbook install_nginx.yml 